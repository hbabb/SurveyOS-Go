[tools]
bun = "latest"
go = "1.27"
"go:github.com/pressly/goose/v3/cmd/goose" = "latest"
sqlc = "latest"

[tasks.migrate-new]
description = "Create a new timestamped goose migration"
usage = 'arg "<name>" help="Migration name, e.g. create_employees_table"'
run = 'doppler run -- goose create "${usage_name?}" sql'

[tasks.migrate-up]
description = "Apply all pending migrations"
run = "doppler run -- goose up"

[tasks.migrate-down]
description = "Roll back the most recent migration"
run = "doppler run -- goose down"

[tasks.migrate-status]
description = "Show which migrations are applied"
run = "doppler run -- goose status"

[tasks.pod-up]
description = "Start the dev pod"
run = "podman kube play deploy/surveyos-dev.kube.yaml"

[tasks.pod-down]
description = "stop the dev pod (keeps the database)"
run = "podman kube play --down deploy/surveyos-dev.kube.yaml"

[tasks.pod-replace]
description = "Recreate the dev pod after changing its file"
run = "podman kube play --replace deploy/surveyos-dev.kube.yaml"